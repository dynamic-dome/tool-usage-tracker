name: no-agent-memory
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if agent-memory or session artifacts are tracked
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.agent-memory/|(^|/)agent-memory/|(^|/)\.openclaw/|session-corpus|transcript.*\.jsonl$' || true)
          if [ -n "$hits" ]; then echo "Tracked memory/session artifacts found:"; echo "$hits"; exit 1; fi
          echo "OK: no memory/session artifacts tracked"
